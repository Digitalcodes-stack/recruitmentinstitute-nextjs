server {
    listen 80;
    server_name recruitmentinstitute.in www.recruitmentinstitute.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name recruitmentinstitute.in www.recruitmentinstitute.in;

    ssl_certificate /etc/letsencrypt/live/recruitmentinstitute.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruitmentinstitute.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Main app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
