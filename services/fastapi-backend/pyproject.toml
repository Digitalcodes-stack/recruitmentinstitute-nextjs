[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-institute-fastapi"
version = "0.1.0"
description = "Recruitment Institute FastAPI microservice"
requires-python = ">=3.10"

# Runtime dependencies
dependencies = [
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "psycopg2-binary>=2.9.12,<3.0",
    "alembic==1.18.4",
    "python-jose[cryptography]>=3.3,<4.0",
    "redis>=4.5,<5.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "email-validator>=2.2,<3.0",
    "reportlab>=4.2,<5.0",
    "sentence-transformers>=3.0.0,<4.0",
    "transformers>=4.40,<5.0",
    "keybert>=0.8,<1.0",
    "nltk>=3.9,<4.0",
    "spacy>=3.7,<4.0",
    "en-core-web-sm",
    "faiss-cpu>=1.8,<2.0",
    "anthropic>=0.45,<1.0",
    "openai>=1.60,<2.0",
    "google-genai>=1.0,<2.0",
    "aiosmtplib>=5.1.2",
    "aiofiles>=25.1.0",
    "celery>=5.6.3",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "jinja2>=3.1.6",
]

[tool.setuptools]
package-dir = {"" = "."}

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.12",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
